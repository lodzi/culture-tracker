name: Weekly brand signals email

on:
  schedule:
    # Vrijdag 08:00 UTC = 10:00 Brussel zomertijd (CEST).
    # Later dan de oude 06:00 zodat er donderdagavond/vrijdagochtend tijd is om
    # de selectie te maken en te pushen. Pas dit aan naar wens.
    - cron: "0 8 * * 5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  weekly-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # TESTFASE: past eerst Lode's keuze uit test/topics-*.md toe op latest.json.
      # Bij een geldige selectie (precies 3 nummers) stuurt Mailchimp die 3.
      # Bij ontbrekende/ongeldige selectie stopt de stap met exit 2 -> GEEN mail
      # naar de audience, en de workflow faalt zichtbaar als signaal.
      # Om terug te keren naar de oude automatische top-3: vervang de run-regel
      # hieronder door alleen `npm run weekly-email`.
      - name: Apply Lode's selection + send weekly brand signals email
        env:
          MAILCHIMP_API_KEY:   ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID:   ${{ secrets.MAILCHIMP_LIST_ID }}
          EMAIL_FROM_NAME:     ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL:    ${{ secrets.EMAIL_FROM_EMAIL }}
          PUBLIC_URL:          ${{ secrets.PUBLIC_URL }}
        run: node scripts/test-apply-selection.js && npm run weekly-email
